name: pnpm Example Workflow
on:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install
    - name: Build package
      run: pnpm build
